services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-past_exam}
      POSTGRES_USER: ${POSTGRES_USER:-past_exam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-past_exam_password}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mcli mb local/past-exam --ignore-existing;
      mcli anonymous set download local/past-exam;
      mcli admin config set local api cors_allow_origin='*';
      mcli service restart local;
      sleep 5;
      exit 0;
      "

  backend:
    build:
      context: ./ntpu-past-exam-service
      dockerfile: Dockerfile.dev
    restart: on-failure
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./ntpu-past-exam-service:/app
    environment:
      DATABASE_DRIVER: postgresql+psycopg
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: ${POSTGRES_USER:-past_exam_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-past_exam_password}
      DATABASE: ${POSTGRES_DB:-past_exam}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      R2_URL: http://minio:9000
      R2_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      R2_ACCESS_TOKEN: ${S3_SECRET_KEY:-minioadmin}
      R2_BUCKET_NAME: past-exam
      R2_FILE_PATH: http://${HOST_IP:-127.0.0.1}:${S3_PORT:-9000}/past-exam
      HASH_KEY: ${HASH_KEY:-local-dev-secret-key-change-me}
      ORIGIN: http://${HOST_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}
      AUTH_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},http://${HOST_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOW_LEGACY_REFRESH_BEARER: ${AUTH_ALLOW_LEGACY_REFRESH_BEARER:-false}
      AUTH_RATE_LIMIT_REQUESTS: "10"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_RATE_LIMIT_TRUST_PROXY_HEADERS: "false"
      GOOGLE_SERVICE_CLIENT_ID: ${GOOGLE_SERVICE_CLIENT_ID:-placeholder}
      GOOGLE_SERVICE_SERCET: ${GOOGLE_SERVICE_SERCET:-placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./ntpu-past-exam
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./ntpu-past-exam:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CI: "true"
      NEXT_PUBLIC_API_ORIGIN: http://${HOST_IP:-127.0.0.1}:${BACKEND_PORT:-8080}
      API_ORIGIN: http://${HOST_IP:-127.0.0.1}:${BACKEND_PORT:-8080}
      NEXT_PUBLIC_GOOGLE_LOGIN_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_LOGIN_CLIENT_ID:-placeholder}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
